<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Café Delight</title>
    <meta name="description" content="Visit Café Delight at 123 Coffee Lane, Brewtown, or send us a message. We'd love to hear from you.">
    <meta name="theme-color" content="#8b4513">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact Us | Café Delight">
    <meta property="og:description" content="Visit us at 123 Coffee Lane, Brewtown, or send us a message.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <script>document.documentElement.classList.add('js');</script>
    <script src="script.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">
        <nav class="nav" aria-label="Main">
            <a class="logo" href="index.html">Café Delight</a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation">&#9776;</button>
            <ul class="nav-links" id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main">
        <section class="section">
            <h1>Contact Us</h1>
            <p>Visit us at 123 Coffee Lane, Brewtown, or reach out below.</p>

            <!-- TODO: action="#" does not send anything yet. Point it at a form service
                 (e.g. Formspree or Netlify Forms) or your own backend endpoint. -->
            <form class="contact-form" action="#" method="post">
                <div class="form-field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button class="btn" type="submit">Send</button>
            </form>

            <address class="contact-details">
                Phone: <a href="tel:+11234567890">(123) 456-7890</a><br>
                Email: <a href="mailto:info@cafedelight.com">info@cafedelight.com</a>
            </address>
        </section>
    </main>

    <footer class="site-footer">
        <!-- TODO: replace the # links with your real social profile URLs -->
        <p>&copy; <span id="year">2026</span> Café Delight. Follow us on <a href="#">Instagram</a> | <a href="#">Facebook</a></p>
    </footer>
</body>
</html>
